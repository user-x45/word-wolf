<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ワードウルフ</title>
<style>
:root{
	--bg:#f5f5f6;
	--surface:#ffffff;
	--surface-2:#eef0f2;
	--border:#d8dade;
	--text:#1a1a1e;
	--text-muted:#5b5e66;
	--accent:#2f5fdb;
	--accent-text:#ffffff;
	--danger:#c62a2a;
	--radius:8px;
}
@media (prefers-color-scheme: dark){
	:root{
		--bg:#121214;
		--surface:#1b1c1f;
		--surface-2:#242529;
		--border:#333438;
		--text:#e7e7ea;
		--text-muted:#9a9ca3;
		--accent:#5b8bff;
		--accent-text:#0c0d0f;
		--danger:#ff6b6b;
	}
}
*{box-sizing:border-box;}
html,body{
	margin:0;padding:0;
	font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
	background:var(--bg);
	color:var(--text);
	-webkit-tap-highlight-color:transparent;
}
body{
	min-height:100vh;
	display:flex;
	flex-direction:column;
	align-items:center;
	padding:0 0 40px;
}
.wrap{
	width:100%;
	max-width:480px;
	padding:0 16px;
}
.screen{display:none;}
.screen.active{display:block;}

header.top{
	width:100%;
	text-align:center;
	padding:28px 0 4px;
	border-bottom:1px solid var(--border);
	margin-bottom:20px;
}
header.top h1{
	font-size:1.3em;
	margin:0;
	font-weight:600;
	letter-spacing:.02em;
}
header.top p{
	margin:4px 0 16px;
	font-size:.85em;
	color:var(--text-muted);
}
.online-link{
	display:inline-block;
	padding:8px 20px;
	border-radius:6px;
	border:1px solid var(--accent);
	background:transparent;
	color:var(--accent);
	font-size:.85em;
	font-weight:600;
	text-decoration:none;
	margin-bottom:16px;
}
.online-link:active{opacity:.8;}

.card{
	background:var(--surface);
	border:1px solid var(--border);
	border-radius:var(--radius);
	padding:18px 16px;
	margin-bottom:14px;
}

.field{margin-bottom:18px;}
.field:last-child{margin-bottom:0;}
.field label{
	display:block;
	font-weight:600;
	font-size:.85em;
	margin-bottom:8px;
	color:var(--text-muted);
}
.stepper{
	display:flex;
	align-items:center;
	justify-content:center;
	gap:16px;
}
.stepper button{
	width:36px;height:36px;
	border-radius:6px;
	border:1px solid var(--border);
	background:var(--surface-2);
	color:var(--text);
	font-size:1.1em;
	font-weight:600;
	cursor:pointer;
}
.stepper button:active{background:var(--border);}
.stepper .val{
	min-width:60px;
	text-align:center;
	font-size:1.3em;
	font-weight:600;
}
.stepper .val small{display:inline;font-size:.6em;font-weight:400;color:var(--text-muted);margin-left:2px;}

.error-msg{
	display:none;
	color:var(--danger);
	font-size:.8em;
	margin-top:6px;
	text-align:center;
}

.time-row{
	display:flex;
	align-items:center;
	justify-content:center;
	gap:8px;
	font-size:1em;
	font-weight:600;
}
.time-row input.time-input{
	width:52px;
	text-align:center;
	background:var(--surface-2);
	color:var(--text);
	border:1px solid var(--border);
	border-radius:6px;
	padding:8px 4px;
	font-size:16px;
	font-weight:600;
	font-family:inherit;
}

.cat-grid{
	display:grid;
	grid-template-columns:1fr 1fr;
	gap:8px;
}
.cat-btn{
	border:1px solid var(--border);
	background:var(--surface-2);
	color:var(--text);
	border-radius:6px;
	padding:12px 8px;
	font-size:.95em;
	font-weight:500;
	font-family:inherit;
	cursor:pointer;
}
.cat-btn.selected{
	border-color:var(--accent);
	background:var(--accent);
	color:var(--accent-text);
	font-weight:600;
}
.cat-btn.random{grid-column:1 / span 2;}

.btn-main{
	width:100%;
	padding:13px;
	border:1px solid var(--accent);
	border-radius:6px;
	background:var(--accent);
	color:var(--accent-text);
	font-size:1em;
	font-weight:600;
	font-family:inherit;
	cursor:pointer;
	margin-top:4px;
}
.btn-main:active{opacity:.85;}
.btn-sub{
	width:100%;
	padding:12px;
	border:1px solid var(--border);
	border-radius:6px;
	background:var(--surface);
	color:var(--text);
	font-size:.95em;
	font-weight:500;
	font-family:inherit;
	cursor:pointer;
	margin-top:8px;
}

input.name-input{
	width:100%;
	padding:12px;
	border-radius:6px;
	border:1px solid var(--border);
	background:var(--surface-2);
	color:var(--text);
	font-size:1em;
	font-family:inherit;
	margin-bottom:10px;
}
input.name-input::placeholder{color:var(--text-muted);}

.center-stage{
	text-align:center;
	padding:36px 8px 20px;
}
.player-badge{
	display:inline-block;
	background:var(--surface-2);
	border:1px solid var(--border);
	border-radius:6px;
	padding:6px 18px;
	font-weight:600;
	margin-bottom:18px;
}
.msg2{
	font-size:1.6em;
	font-weight:700;
	min-height:1.3em;
	margin:8px 0 26px;
	color:var(--text);
}
.msg{
	font-size:1em;
	color:var(--text-muted);
	min-height:1.3em;
}
.tap-hint{
	font-size:.8em;
	color:var(--text-muted);
	margin-top:24px;

}

.timer-circle{
	width:200px;height:200px;
	margin:16px auto 8px;
	border-radius:50%;
	border:3px solid var(--border);
	display:flex;align-items:center;justify-content:center;
}
.timer-circle .time{
	font-size:2.2em;
	font-weight:700;
	font-variant-numeric:tabular-nums;
}
.category-tag{
	display:inline-block;
	background:var(--surface-2);
	border:1px solid var(--border);
	border-radius:6px;
	padding:4px 14px;
	font-size:.8em;
	margin-bottom:10px;
	color:var(--text-muted);
}

.reveal-list p{
	background:var(--surface-2);
	border:1px solid var(--border);
	border-radius:6px;
	padding:10px 14px;
	margin:8px 0;
	font-size:.95em;
}
.reveal-list p b{color:var(--text);}

.progress-dots{
	display:flex;justify-content:center;gap:6px;margin-bottom:20px;
}
.progress-dots span{
	width:7px;height:7px;border-radius:50%;background:var(--border);
}
.progress-dots span.done{background:var(--accent);}
.progress-dots span.current{background:var(--text);}

</style>
</head>
<body>

<header class="top">
	<h1>ワードウルフ</h1>
	<p>お題が違う人（ウルフ）を会話で見つけるゲーム</p>
	<a href="/online/" class="online-link">オンライン版はこちら</a>
</header>

<div class="wrap">

	<!-- 1. セットアップ画面 -->
	<section id="screen-setup" class="screen active">
		<div class="card">
			<div class="field">
				<label>参加人数</label>
				<div class="stepper">
					<button type="button" onclick="changeCount('player', -1)">－</button>
					<div class="val" id="playercount-val">4<small>人</small></div>
					<button type="button" onclick="changeCount('player', 1)">＋</button>
				</div>
				<div class="error-msg" id="error_playercount">3人以上を選んでください</div>
			</div>
			<div class="field">
				<label>ウルフの人数</label>
				<div class="stepper">
					<button type="button" onclick="changeCount('wolf', -1)">－</button>
					<div class="val" id="wolfcount-val">1<small>人</small></div>
					<button type="button" onclick="changeCount('wolf', 1)">＋</button>
				</div>
				<div class="error-msg" id="error_wordwolfcount">1人以上、参加人数未満にしてください</div>
			</div>
			<div class="field">
				<label>トークタイム</label>
				<div class="time-row">
					<input type="text" inputmode="numeric" pattern="[0-9]*" id="talktime_min" class="time-input" value="3" maxlength="2" oninput="onTimeInput(this,'min')">分
					<input type="text" inputmode="numeric" pattern="[0-9]*" id="talktime_sec" class="time-input" value="00" maxlength="2" oninput="onTimeInput(this,'sec')">秒
				</div>
				<div class="error-msg" id="error_talktime">1秒以上を設定してください</div>
			</div>
		</div>

		<div class="card">
			<div class="field" style="margin-bottom:8px;">
				<label>トークテーマ</label>
			</div>
			<div class="cat-grid" id="cat-grid"></div>
		</div>

		<button class="btn-main" onclick="roommakeNext()">お題を決めてすすむ</button>
	</section>

	<!-- 2. 名前入力画面 -->
	<section id="screen-names" class="screen">
		<div class="card">
			<div class="field">
				<label>参加者の名前を入力してください</label>
				<div id="names"></div>
			</div>
		</div>
		<button class="btn-main" onclick="nameNext()">つぎへ</button>
		<button class="btn-sub" onclick="goScreen('setup')">戻る</button>
	</section>

	<!-- 3. お題確認画面（端末を回して1人ずつ確認） -->
	<section id="screen-odai" class="screen">
		<div class="center-stage">
			<div class="progress-dots" id="odai-dots"></div>
			<div class="category-tag" id="odai-category"></div>
			<div class="player-badge" id="odai-player"></div>
			<div class="msg" id="msg"></div>
			<div class="msg2" id="msg2"></div>
			<input type="hidden" id="nowId" value="0">
			<button class="btn-main" id="next" onclick="nextMemberOdai()">はい</button>
			<div class="tap-hint">端末を次の人に回してからタップしてください</div>
		</div>
	</section>

	<!-- 4. ゲーム中（タイマー）画面 -->
	<section id="screen-game" class="screen">
		<div class="center-stage">
			<div class="category-tag" id="game-category"></div>
			<p style="opacity:.8;margin-bottom:0;">自分のお題について、バレないように話し合おう！</p>
			<div class="timer-circle"><div class="time" id="time">--:--</div></div>
			<p style="opacity:.6;font-size:.85em;">トークタイムが終わると自動的に次の画面に進みます</p>
			<button class="btn-sub" onclick="cancelGame()">最初の画面に戻る</button>
		</div>
	</section>

	<!-- 4.5 終了確認画面（答えが見える前のワンクッション） -->
	<section id="screen-confirm" class="screen">
		<div class="center-stage" style="padding-top:20px;">
			<div class="msg2" style="font-size:1.5em;">トーク終了</div>
			<p style="opacity:.8;">話し合いは終わりましたか？<br>次の画面で答えが表示されます。</p>
		</div>
		<button class="btn-main" onclick="revealAnswers()">答え合わせをする</button>
	</section>

	<!-- 5. 結果発表画面 -->
	<section id="screen-finish" class="screen">
		<div class="center-stage" style="padding-top:20px;">
			<div class="msg2" style="font-size:1.5em;">トーク終了！</div>
			<p style="opacity:.8;">誰がウルフだったか話し合おう。答え合わせはこちら</p>
		</div>
		<div class="card">
			<div class="reveal-list" id="waitmember"></div>
		</div>
		<button class="btn-main" onclick="sameThemeContinue()">お題だけを変えて続行</button>
		<button class="btn-main" onclick="openOdaiChange()">テーマを変えて続行</button>
		<button class="btn-sub" onclick="resetAll()">最初からやり直す</button>
	</section>

	<!-- 5.5 お題だけ変更する専用画面 -->
	<section id="screen-odaichange" class="screen">
		<div class="card">
			<div class="field" style="margin-bottom:8px;">
				<label>お題を引き直すテーマを選んでください</label>
			</div>
			<div class="cat-grid" id="cat-grid-change"></div>
		</div>
		<button class="btn-main" onclick="applyOdaiChange()">このテーマでお題を引く</button>
		<button class="btn-sub" onclick="goScreen('finish')">戻る</button>
	</section>

</div>

<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
